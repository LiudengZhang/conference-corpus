  - id: agentic-ai
    claim: >-
      LLM agents become working biomedical research infrastructure, not demonstrations.
    opened: 2023-03
    note: >-
      THE DIFFUSION CHAIN THAT USED TO BE HERE WAS VOID WHEN IT WAS WRITTEN.
      It read: first LLM-agent paper ESCARGOT 2025-02-04; the word "agentic"
      four days later; oncology journal 2025-06; wet-lab-adjacent 2025-08;
      immunology 2025-12; "ten months, general and methods bench to immunology
      bench". Four of those five were already contradicted by this file's own
      2024 cards on the day it was written — 38799228 puts an LLM agent with
      tools in a tracked journal in 2024-01, and 39690222 puts an agent in
      Nature Cancer in 2024-12 — so the ten-month interval was computed between
      two dates that were both floors. It was removed on 2026-08-27.
      What survives is not a corrected chain but the reason not to build one:
      every waypoint in it was the earliest month then being read, and each
      moved on extension. CRISPR-GPT is the same lesson in miniature — an
      earlier version of this file dated it 2025-07 as the moment agents became
      wet-lab-facing; the index says 2026-02. (That sentence stood twice in this
      note, in two phrasings, until 2026-09-04.)
      What replaces the chain is a census. On 2026-09-04 all 9,343 research
      abstracts of 2024 were read for this thread specifically, and every LLM
      system found was reported whether carded or not. The tally: 2024-01
      FunSearch (Nature, an LLM in a closed evaluator loop, non-biomedical) and
      38799228; 2024-03 SPIRES/OntoGPT; 2024-06 Self-BioRAG and KRAGEN, both in
      Bioinformatics, both evaluated only on QA benchmarks; 2024-10 GENEVIC;
      2024-12 39690222. Q3 contains none at all. That is roughly one agent a
      quarter, every one of them in a methods or bioinformatics venue, and none
      of them deployed.
      The one LLM in the year that demonstrably changed clinical practice is
      38664535 (Nature Medicine, 2024-06): it cut near-miss events by a third in
      a working pharmacy, and it does so with single-pass extraction and
      deterministic rules — no agent loop at all. The thread claims agents become
      infrastructure rather than demonstrations. Through 2024 the agents are
      demonstrations and the infrastructure is not an agent.

