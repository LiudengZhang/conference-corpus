  - id: clinical-practice
    claim: >-
      Tracked meetings predict practice-changing readouts months before they publish.
    not_cardable: >-
      `opened` is null because this thread now has no cards, and that is
      correct rather than missing. It read 2024-03 until 2026-08-27, anchored
      on the single primary trial report among its eight — a journal title
      setting the floor of a thread whose whole justification is that journal
      titles cannot evidence it. Note that check_corpus.py PASSES a thread with
      no cards: the `opened` check skips when there is nothing to compute
      from, so a stale value here would have survived indefinitely. That is the
      silent-pass this file's header warns about, met in the wild.
      THIS THREAD CANNOT BE EVIDENCED BY A JOURNAL CARD, IN EITHER DIRECTION,
      and eight cards were written for it anyway before that was noticed. Every
      one was `refutes`, and reading them against their abstracts on 2026-08-27
      showed they track something else entirely — "the readout says do less" or
      "this trial was negative". Two report positive findings (less frequent
      mammograms pose no greater risk; GLP-1 drugs do not raise aspiration
      risk) and were still carded as refutations, because the reader was
      scoring the direction of clinical advice rather than the thread's claim.
      No paper among them mentions a meeting. A title or abstract carries no
      presentation history, so a podium-to-paper interval is not visible in the
      journal index at any level of reading care — which is also why four
      independent readers wrote no 2023 card for this thread.
      The thread is measured, but by scripts/lead_time.py rather than by cards:
      see `measured` and `negative_result` below. Its cards are being removed
      rather than re-stanced, because a mis-assigned card is not a wrong answer
      to this thread's question, it is an answer to a different question.
    opened: null
    note: >-
      The corpus's self-test, not a claim about biology. It was measured for the
      first time on 2026-08-26 by scripts/lead_time.py, against AACR and ASCO
      2024 (14,895 abstracts, Crossref) and the journal index running to 2026-08.
      Until then the whole corpus rested on this claim untested, because the
      journal index started at 2025-01 and every conference vault was 2026 — the
      two layers did not overlap enough for a lead to be visible in either
      direction.
    measured: >-
      Podium-to-paper lag is 10-13 months (IQR roughly 7 to 20), and that figure
      is stable across every matching threshold tried, which is the strongest
      part of the result. It replaces the previous estimate of 4-6 months, which
      came from five hand-picked cases and was low by roughly a factor of two.
      The hit rate is the bad news: matching abstract titles to later papers
      gives 0.7% at a Jaccard cutoff of 0.5, so of the order of one abstract in
      a hundred becomes a paper in these 33 journals within two years. The
      meeting leads, and it leads by about a year — but as a filter it is close
      to useless, and any claim that a direction was "seen first at a meeting"
      has to survive the fact that roughly 99% of what is said there never
      arrives.
      The old baseline was selected with `month < 2024-04` from an index whose
      first month was 2024-01, so the "before the meetings" arm was
      2024-01..2024-03 — the exact months this cohort deposits into: ASCO's GI
      and GU symposia in January and February, AACR in March. It measured
      simultaneity, which is the one thing a coincidence arm has to exclude, and
      it was a tenth the size of the arm it was compared with. It claimed an
      excess of 0.2 to 1.2 percentage points.
      Extending the index to 2023-01 gave twelve genuinely pre-meeting months.
      With both arms thinned to the same 11,724 titles the effect is real but
      much smaller, and it inverts across the threshold: x1.0 at Jaccard 0.35
      (181 matches against 182 by chance — no advantage whatever), x2.2 at 0.45,
      x2.1 at 0.50, x3.0 at 0.60. The meeting leads only where matching is
      strict. The published version read as though the effect were strongest at
      loose matching, which was exactly backwards.
      RE-MEASURED 2026-08-28 ON ABSTRACTS RATHER THAN TITLES, and it holds. The
      whole test had matched conference abstracts against journal titles,
      because the index carried no abstracts; that was the obvious suspect for
      the ~1% conversion. With abstracts on both sides the answer does not move:
      x2.5 over chance at the abstract operating point, median lag still 12
      months. The rate was not a title artefact. This is the first measurement
      in this corpus that a wider window or a better instrument has failed to
      overturn, and that is now the strongest thing that can be said for it.
    negative_result: >-
      The vocabulary version of this claim is refuted outright. Ranking terms by
      how over-represented they are at the meetings relative to the 2024 journals
      predicts 2024-to-2026 journal growth at rho +0.091 once abstract register
      is controlled for, against +0.088 for a null predictor built from a random
      half of the journals' own 2024 output. The gap is 0.003. Reading abstract
      books for emerging vocabulary, as opposed to for specific results, recovers
      nothing the journals did not already contain. The apparent signal before
      controls (+0.168) was abstract shorthand — `mcrpc`, `pts with metastatic`,
      `real world` — which journal titles never use whatever the science does.
