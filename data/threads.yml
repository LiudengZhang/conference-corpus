# Threads — falsifiable claims about where a field is going.
#
#   id          stable slug; never reuse or delete (see aliases)
#   claim       one sentence, falsifiable. Not a topic label.
#   opened      month of the FIRST evidence card on this thread, computed from
#               data/evidence.yml — not asserted, and not the month somebody
#               first noticed the topic.
#   aliases     ids merged into this one; kept so old references never break
#   denominator when the card set is structurally one-sided, what the other
#               side is and how big it is. A thread whose supporting evidence
#               is a genre rather than a set of citable findings cannot be
#               read from its ratio alone, and saying so here is the only
#               thing that stops the ratio from lying.
#
# Status is NOT stored. It is derived from the cards by scripts/build_briefing.py
# every time a briefing is generated, using a rule written down in that file.
# Storing it here would let it drift away from the evidence, which is what
# happened to the first version of this file: every `status` in it was asserted
# from a single month's reading and none of them recomputed.
#
# Rebuilt 2026-08-26 from 483 cards spanning 2024-01 .. 2026-08.
#
# READ `opened` AS A PROPERTY OF THE WINDOW, NOT OF THE FIELD. It has now been
# recomputed twice. Under a 2025-08 floor, every thread opened in 2025-08 or
# just after. Under a 2025-01 floor, twelve of thirteen moved earlier. Under a
# 2024-01 floor, all thirteen moved earlier again — six landed on 2024-01
# itself, the first month that exists, and eleven of thirteen sit within three
# months of it. A value that relocates to the floor every time the floor is
# lowered is measuring the floor. Only `interception` at 2025-01 sits far
# enough from the edge to carry information, and it is the control case.
#
# (That count read "eight of them landed on 2024-01" until 2026-08-27. It was
# six. A file whose subject is unverified assertions carried an unverified
# assertion about itself for a day; the number is now computed, not recalled.)
#
# The same applies to every "first appearance" claim these notes contain, and
# the record is unambiguous: six such claims have now been made in this corpus
# and six have moved earlier on extension, none has ever survived. Treat any
# statement of the form "X appeared first in month M" as shorthand for "no
# earlier instance exists in the months read", which is a fact about reading.
# scripts/check_corpus.py enforces that `opened` matches the cards; nothing can
# enforce that the window is wide enough.
#
# The floor moves again on 2026-08-27, to 2023-01. `opened` depends on cards
# alone and not on the index, so nothing here changes until 2023 cards are
# written — which means check_corpus.py will keep passing on a floor it cannot
# see is understated. That silence is the failure mode, not a reassurance.

threads:

  - id: neuro-immune-microbiome-axis
    claim: >-
      Neural, microbial, and lymphoid-structure control of the tumour microenvironment
      are one mechanism network, not three adjacent fields, and neurotransmitters are
      a shared currency between them.
    opened: 2024-01
    aliases: [neuro-immuno-oncology, tls-as-target, microbiome-io, cancer-neuroscience]
    note: >-
      The healthiest thread in the corpus and the one most resistant to being called
      early. Three separate agents flagged it as crowded or peaking (2025-02, 2025-08,
      2025-11) on the grounds of dense publication with no clinical readout. All three
      were wrong so far. The distinction that matters: a direction with negative
      clinical readouts is failing; a direction with no clinical readouts is merely
      untested, and the two look identical from the literature alone.

  - id: foundation-models
    claim: >-
      Scaling data and parameters produces general-purpose models of biology that
      transfer across tasks, individuals and into clinical use.
    opened: 2024-01
    aliases: [virtual-cell, scfm]
    note: >-
      The thread's own negative control was published as a title in 2025-12:
      foundation models in oncology win benchmarks and miss the clinic. On dating
      the vocabulary, see the caution below — an earlier version of this file put
      the arrival of "virtual cell" in these journals at 2025-11, twelve months
      after the Cell challenge. Both halves were wrong. The phrase is in a Nature
      Biotechnology title in 2025-04, two months BEFORE the challenge launched in
      2025-06, and again in Cell in 2025-08; single-cell foundation models were
      evaluated as a class in 2025-04 and 2025-06. Vocabulary and critique have
      been co-present since spring 2025.
    dating_caution: >-
      Every "first appearance" claim in this corpus is bounded by which months
      were read. Three moved earlier when 2025-01..07 was backfilled; all of
      them moved AGAIN when 2024 was added on 2026-08-26, and two more joined
      them. The current record, none of which should be trusted either:
      "virtual cell" is in a Cell title in 2024-12 (39672099), not 2025-11 and
      not 2025-04. AI agents reach an oncology journal in 2024-12 (39690222,
      Nature Cancer), not 2025-06. The first LLM-agent-with-tools paper in a
      tracked journal is 2024-01 (38799228, chemistry tools), not ESCARGOT in
      2025-02 — thirteen months out. Simple-beats-complex for sequence models
      is 2024-03 (38428432, convolutions competitive with transformers), not
      2025-06. Clinical-AI limitations are stated in a Nature Medicine title in
      2024-09 (38965432). Single-cell foundation models and their audits arrive
      in the same journal in the same month, 2024-08 (38409223, 38844628 and
      38528186) — the critique was never lagging the vocabulary at all.
      Assume any such claim is an upper bound on the date, never the date.

  - id: method-credibility
    claim: >-
      Published methods, reference resources and reagents are reliable enough to
      build on without re-checking them.
    opened: 2024-01
    aliases: [reproducibility, self-audit]
    denominator: >-
      Structurally one-sided by construction: this is a ledger of things found
      unreliable, so every card refutes and the derived status is uninformative.
      Read the volume instead — with the denominator attached, because the two
      series in this corpus do not join.
      Over general+bioinfo together, 2025-01..07 runs 1 in 70, 1 in 73, 1 in 44,
      1 in 36, 1 in 33, 1 in 40, 1 in 36: roughly a doubling across the half-year.
      Over bioinfo alone, 2025-06..12 runs 1 in 24, 1 in 21, 1 in 14, 1 in 15,
      1 in 14, 1 in 10. An earlier version of this file quoted the second series
      as if it were the first and reported a monotone 7x rise; the correct
      statement is a doubling on the wide denominator and a further roughly
      doubling on the narrow one, which is still growth but not that growth.
      What survives re-reading unchanged is the escalation of the audit's object:
      from the model, to the pipeline, to the instrument, the wet-lab assay, the
      generative model's own output, and by 2026 the software version number.
    measured_series: >-
      Both series above were produced by readers, not by a rule, and neither can
      be compared across months. On 2026-08-26 scripts/scan_titles.py was run
      over all months read with one written pattern set, giving the first
      comparable series this thread has ever had. As a share of general+bioinfo
      titles: 2024 is 1 in 210 (40 hits / 8,413), 2025 is 1 in 189 (51 / 9,661),
      2026-01..08 is 1 in 102 (75 / 7,633). Aggregate by year, because the
      monthly counts run 1 to 16 and the month-to-month noise swamps everything.
      The correction that matters: 2024 and 2025 are indistinguishable, and the
      roughly two-fold rise happens in 2026. This thread has been asserting a
      doubling ACROSS 2025, and under a consistent rule that doubling is not
      there. The genre grew — a year later than recorded.
      Absolute levels are lower than the reader-derived series because a regex
      catches only direction-stating phrases it was told about; use it for shape
      across months, never as a count of the genre.

  - id: suppressive-population-inversion
    claim: >-
      Depleting or blocking a cell population identified as immunosuppressive
      improves antitumour outcomes.
    opened: 2024-03
    note: >-
      Opened 2026-08-26 by the 2025 backfill. This thread did not exist in the
      version of this file derived from a single month of 2026 reading, and finding
      it is the clearest thing the backfill bought. Nineteen title-stated inversions
      in twelve months, spread across NK cells, pDCs, Tregs, MAIT cells, fibroblasts,
      neutrophils, MDSCs, TIGIT and CD47 — several of them published in the same
      journal and the same month as papers proposing to target the same population.
    denominator: >-
      The supporting side is not carded and cannot be, because it is a genre rather
      than a set of citable findings: the templated preclinical block that nominates
      a suppressive target, deletes it, and reverses immune suppression in mice. It
      runs at roughly 12-33 papers a month across the eight oncology journals.
      Treat the ratio as "documented inversions against a steady stream of
      nominations", never as a bare count against zero.
    counting_caution: >-
      An earlier version of this file gave the block as 55, 35, 23, 30, 19, 11, 14,
      18, 14, 23 for 2025-03..12 and read a decline into it. That series is void.
      Re-counting 2025-01..07 under one consistent written rule gave 12, 17, 33, 13,
      25, 31, 22 — January is 12, not 55. The between-reader spread on a single
      month is as large as the spread across months, so nothing in that series
      supports a trend in either direction. One reader reconstructed how the
      earlier figure was probably built: including therapeutic-payload papers
      alongside target-nomination papers moves a month from 9/22 to 15/28. The
      general lesson for this corpus: a count is only comparable across months if
      the counting rule was written down before the counting, and quoted with the
      number afterwards.

  - id: next-gen-checkpoints
    claim: >-
      Targets beyond PD-1/CTLA-4 deliver a second generation of checkpoint blockade.
    opened: 2024-03
    note: >-
      The measured failure mode is not that individual targets fail — it is that the
      category is dissolving. A novel surface co-inhibitory receptor name has a
      half-life of two to four months in this corpus; ligand-side and intracellular
      nominations last longer. By 2025-12 the new nominations (CLEVER-1, CD300e,
      TIPE2, NEAT1) are macrophage and lncRNA targets rather than T-cell surface
      receptors, and the only clinical-stage non-PD-1 content is B7-H3 and an
      Fc-enhanced CTLA-4 — both from waves preceding the current preclinical set.
      An earlier version of this note asserted that across all of 2025 not one
      newly nominated checkpoint entered a phase 1, and followed it with
      "2025-10 returned zero hits for the entire target list". The second
      sentence is a fact about one month's reading and was never evidence for
      the first. Both are superseded by `registry_check` below, which tested
      the first sentence against the trial registry rather than the literature.
    registry_check: >-
      Checked 2026-08-27 against data/regulatory.sqlite (ct_trials), which did
      not exist when the claim was written. First run covered 2024-01..2026-08;
      the table was widened to 2023-01..2026-08 the same day and the check
      re-run over 5,666 phase-1 oncology trials in 44 months. Both runs agree
      on the Tier C result below. They do not agree on the `denominator`
      field's list of zeroes — see `retraction`. Rule, fixed before counting: phases in PHASE1 /
      PHASE1;PHASE2 / EARLY_PHASE1, onc_conditions=1, binned on
      studyFirstPostDate; target implicated in `title` or `interventions` by
      name or by agent INN; every non-PD-1 hit read individually and classified
      as target-directed or backbone-only. Target list derived from the corpus,
      not from recall: 398 checkpoint-context journal titles and 3,005
      checkpoint-context sentences in the AACR/ASCO 2024 abstracts, plus a sweep
      of every "anti-X / targeting X" string in the registry's own phase-1 rows.
      THE CLAIM SURVIVES, NARROWLY AND ONLY AS STATED ABOUT NEW TARGETS. Of the
      seventeen checkpoint targets this corpus first named inside its window —
      IGSF8, ITPRIPL1, BTN1A1, SLC6A6, LRIG1, Siglec-10, PSGL-1, CISH, CLEVER-1,
      CD300e, TIPE2, NEAT1, CD161/LLT1, GARP, VSIG4, TIM-4, Siglec-E — zero
      entered a phase 1 in 2025. The tier produced four phase-1 registrations in
      44 months: LLT1 (NCT06451497, Zumutor, 2024-06) and CD200AR-L
      (NCT06305910, 2024-03); GARP (NCT06964737, Ohio State, 2025-05); and
      bexmarilimab twice in 2026. Unchanged when binned on start_date.
      ONE TRIAL SITS ON THE LINE. NCT06964737 is an anti-GARP CAR-T posted
      2025-05-09, and GARP/TGFβ is called a checkpoint axis in this corpus's own
      journals (2026-02, twice). It survives the claim only because a CAR using
      GARP as a surface antigen is not checkpoint blockade — a distinction the
      old wording did not make. Read loosely, 2025 also holds COM701 (anti-PVRIG,
      NCT06888921) and GI-108 (anti-CD73, NCT07172802); both targets are older
      than the window, so that reading fails on "newly", not on the data.
    denominator: >-
      Quote this instead of the binary, because it survives the definitional
      argument the binary does not. Excluding B7-H3, which is an ADC/CAR antigen
      rather than a blockade target, the phase-1 pipeline for EVERY non-PD-1
      co-inhibitory checkpoint — prior wave and new together — is 6 trials in
      2024, 6 in 2025 and 4 in 2026-to-August, against 175 PD-1 phase 1s in 2025
      alone. THE SECOND SENTENCE OF THIS FIELD WAS WRONG AND IS RETRACTED. It
      read: "VISTA, NKG2A, IDO1, CD39, HPK1, Siglec-15, TREM2, CD96, B7-H4 and
      MERTK each returned zero phase-1 rows across all 32 months." Five of the
      ten have phase-1 trials, and they were missed two different ways. See
      `retraction` below. The surviving claim is the ratio, not the zeroes.
    retraction: >-
      Re-run 2026-08-27 against 5,666 phase-1 oncology trials over 44 months.
      Two mechanisms, and only one of them is about the window.
      THE WINDOW: VISTA had three phase-1 starts in 2023 alone — SNS-101
      (NCT05864144), KVA12123 in a trial actually named VISTA-101
      (NCT05708950), and PMC-309 (NCT05957081). NKG2A had two, both S095029
      (NCT06116136, NCT06162572). All five predate 2024-01 and were invisible
      to a table that started there. The earlier check had already guessed this
      about NKG2A and recorded it as a caveat; extending the trial table to
      2023-01 confirmed it.
      THE FIELDS, WHICH IS THE WORSE ONE: IDO1 (NCT07732413, 2026-07), TREM2
      (EOS006215, NCT06877533, 2025-03) and B7-H4 (NCT06336707, 2024-03) all
      sit INSIDE the original 2024-01..2026-08 window and were missed anyway,
      because the target is named only in `brief_summary` — a field the harvest
      did not store when the claim was made. So this was not a window error at
      all. It was a claim about the world made from the columns that happened
      to be in the table.
      CD39 stays at zero. Its only hit, NCT05902520, uses CD39 to select
      tumour-reactive TIL — a biomarker, not a target — which is the kind of
      hit that a keyword count would have scored and a reader catches. HPK1,
      Siglec-15, CD96 and MERTK remain genuinely zero across 44 months.
      The Tier C result is unchanged and has now survived a second test: no
      newly nominated checkpoint entered a phase 1 in 2025, and the widened
      window adds no 2023 Tier C registrations either.
    blind_spot: >-
      REDUCED FROM 42% TO 34%, NOT CLOSED. Storing brief_summary and the
      arm-group fields on 2026-08-27 closed 112 of 612 opaque trials; of
      1,473 phase-1 oncology trials first posted in 2025, 500 still name
      nothing but a bare code. brief_summary did almost all the work (173
      trials legible on that field alone) and arm_interventions did none,
      being fully redundant with the flat interventions column.
      Twenty survivors were read individually and are genuinely opaque —
      SHR-4394, HS387, BI 765049, MB0151, KK2845, MK-4716 — code-named
      programmes whose summaries state only safety, tolerability and PK. So a
      first-in-human antibody against a newly nominated checkpoint can still
      hide here, and one third of the 2025 phase-1 field is still dark. The
      retraction above is what that darkness looks like when it is measured
      rather than assumed away.

