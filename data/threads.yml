# Threads — falsifiable claims about where a field is going.
#
#   id          stable slug; never reuse or delete (see aliases)
#   claim       one sentence, falsifiable. Not a topic label.
#   opened      month of the FIRST evidence card on this thread, computed from
#               data/evidence.yml — not asserted, and not the month somebody
#               first noticed the topic.
#   aliases     ids merged into this one; kept so old references never break
#   denominator when the card set is structurally one-sided, what the other
#               side is and how big it is. A thread whose supporting evidence
#               is a genre rather than a set of citable findings cannot be
#               read from its ratio alone, and saying so here is the only
#               thing that stops the ratio from lying.
#
# Status is NOT stored. It is derived from the cards by scripts/build_briefing.py
# every time a briefing is generated, using a rule written down in that file.
# Storing it here would let it drift away from the evidence, which is what
# happened to the first version of this file: every `status` in it was asserted
# from a single month's reading and none of them recomputed.
#
# Rebuilt 2026-08-26 from 12 months of cards (2025-08 .. 2026-07, 243 cards).
# The corpus reaches back to 2025-01 in data/index.sqlite, but the triage
# output for 2025-01..2025-07 was lost before cards were written, so no thread
# opens earlier than 2025-08 and none of these `opened` dates should be read as
# the true birth of a direction — only as the earliest point this corpus can
# document one.

threads:

  - id: neuro-immune-microbiome-axis
    claim: >-
      Neural, microbial, and lymphoid-structure control of the tumour microenvironment
      are one mechanism network, not three adjacent fields, and neurotransmitters are
      a shared currency between them.
    opened: 2025-08
    aliases: [neuro-immuno-oncology, tls-as-target, microbiome-io, cancer-neuroscience]
    note: >-
      The healthiest thread in the corpus and the one most resistant to being called
      early. Three separate agents flagged it as crowded or peaking (2025-02, 2025-08,
      2025-11) on the grounds of dense publication with no clinical readout. All three
      were wrong so far. The distinction that matters: a direction with negative
      clinical readouts is failing; a direction with no clinical readouts is merely
      untested, and the two look identical from the literature alone.

  - id: foundation-models
    claim: >-
      Scaling data and parameters produces general-purpose models of biology that
      transfer across tasks, individuals and into clinical use.
    opened: 2025-08
    aliases: [virtual-cell, scfm]
    note: >-
      The thread's own negative control was published as a title in 2025-12:
      foundation models in oncology win benchmarks and miss the clinic. On dating
      the vocabulary, see the caution below — an earlier version of this file put
      the arrival of "virtual cell" in these journals at 2025-11, twelve months
      after the Cell challenge. Both halves were wrong. The phrase is in a Nature
      Biotechnology title in 2025-04, two months BEFORE the challenge launched in
      2025-06, and again in Cell in 2025-08; single-cell foundation models were
      evaluated as a class in 2025-04 and 2025-06. Vocabulary and critique have
      been co-present since spring 2025.
    dating_caution: >-
      Every "first appearance" claim in this corpus is bounded by which months
      were read, and each month was read by a different reader searching only its
      own file. Three separate first-appearance claims — the virtual-cell
      vocabulary, wet-lab-facing agents, and simple-baselines-beat-deep-models —
      each moved earlier once the 2025-01..07 backfill ran. Assume any such claim
      is an upper bound on the date, never the date.

  - id: method-credibility
    claim: >-
      Published methods, reference resources and reagents are reliable enough to
      build on without re-checking them.
    opened: 2025-08
    aliases: [reproducibility, self-audit]
    denominator: >-
      Structurally one-sided by construction: this is a ledger of things found
      unreliable, so every card refutes and the derived status is uninformative.
      Read the volume instead — with the denominator attached, because the two
      series in this corpus do not join.
      Over general+bioinfo together, 2025-01..07 runs 1 in 70, 1 in 73, 1 in 44,
      1 in 36, 1 in 33, 1 in 40, 1 in 36: roughly a doubling across the half-year.
      Over bioinfo alone, 2025-06..12 runs 1 in 24, 1 in 21, 1 in 14, 1 in 15,
      1 in 14, 1 in 10. An earlier version of this file quoted the second series
      as if it were the first and reported a monotone 7x rise; the correct
      statement is a doubling on the wide denominator and a further roughly
      doubling on the narrow one, which is still growth but not that growth.
      What survives re-reading unchanged is the escalation of the audit's object:
      from the model, to the pipeline, to the instrument, the wet-lab assay, the
      generative model's own output, and by 2026 the software version number.

  - id: suppressive-population-inversion
    claim: >-
      Depleting or blocking a cell population identified as immunosuppressive
      improves antitumour outcomes.
    opened: 2025-09
    note: >-
      Opened 2026-08-26 by the 2025 backfill. This thread did not exist in the
      version of this file derived from a single month of 2026 reading, and finding
      it is the clearest thing the backfill bought. Nineteen title-stated inversions
      in twelve months, spread across NK cells, pDCs, Tregs, MAIT cells, fibroblasts,
      neutrophils, MDSCs, TIGIT and CD47 — several of them published in the same
      journal and the same month as papers proposing to target the same population.
    denominator: >-
      The supporting side is not carded and cannot be, because it is a genre rather
      than a set of citable findings: the templated preclinical block that nominates
      a suppressive target, deletes it, and reverses immune suppression in mice. It
      runs at roughly 12-33 papers a month across the eight oncology journals.
      Treat the ratio as "documented inversions against a steady stream of
      nominations", never as a bare count against zero.
    counting_caution: >-
      An earlier version of this file gave the block as 55, 35, 23, 30, 19, 11, 14,
      18, 14, 23 for 2025-03..12 and read a decline into it. That series is void.
      Re-counting 2025-01..07 under one consistent written rule gave 12, 17, 33, 13,
      25, 31, 22 — January is 12, not 55. The between-reader spread on a single
      month is as large as the spread across months, so nothing in that series
      supports a trend in either direction. One reader reconstructed how the
      earlier figure was probably built: including therapeutic-payload papers
      alongside target-nomination papers moves a month from 9/22 to 15/28. The
      general lesson for this corpus: a count is only comparable across months if
      the counting rule was written down before the counting, and quoted with the
      number afterwards.

  - id: next-gen-checkpoints
    claim: >-
      Targets beyond PD-1/CTLA-4 deliver a second generation of checkpoint blockade.
    opened: 2025-09
    note: >-
      The measured failure mode is not that individual targets fail — it is that the
      category is dissolving. A novel surface co-inhibitory receptor name has a
      half-life of two to four months in this corpus; ligand-side and intracellular
      nominations last longer. By 2025-12 the new nominations (CLEVER-1, CD300e,
      TIPE2, NEAT1) are macrophage and lncRNA targets rather than T-cell surface
      receptors, and the only clinical-stage non-PD-1 content is B7-H3 and an
      Fc-enhanced CTLA-4 — both from waves preceding the current preclinical set.
      Across all of 2025 not one newly nominated checkpoint entered a phase 1.
      2025-10 returned zero hits for the entire target list.

  - id: immunotherapy-resistance
    claim: >-
      Checkpoint resistance is being explained by mechanisms outside the tumour cell
      and outside T-cell exhaustion — host haematopoiesis, myeloid programmes,
      innervation and the stroma.
    opened: 2025-09

  - id: ctdna-mrd
    claim: >-
      Circulating tumour DNA is a treatment-guiding biomarker, not only a prognostic
      one.
    opened: 2025-09

  - id: interception
    claim: >-
      Cancer can be treated before it is cancer, in measurable precursor states.
    opened: 2025-09

  - id: agentic-ai
    claim: >-
      LLM agents become working biomedical research infrastructure, not demonstrations.
    opened: 2025-09
    note: >-
      The diffusion lag is the reusable measurement, and the chain is now dated
      from the backfill rather than asserted. First LLM-agent paper: ESCARGOT,
      2025-02-04. First title using the word "agentic": four days later. First
      agent in an oncology journal: an autonomous clinical-decision agent in
      Nature Cancer, 2025-06. First wet-lab-adjacent agent: GeneAgent, 2025-08.
      First appearance in any of the nine immunology and systems-biology
      journals: 2025-12, and as an assessment commentary rather than a result.
      Ten months, general and methods bench to immunology bench.
      CRISPR-GPT, which an earlier version of this file dated to 2025-07 as the
      moment agents became wet-lab-facing, is dated 2026-02 in the index.

  - id: neoantigen-vaccines
    claim: >-
      Neoantigens are a large enough and predictable enough target space to support
      personalized cancer vaccines at scale.
    opened: 2025-11

  - id: cell-therapy
    claim: >-
      Engineered cell therapy generalizes beyond CD19-positive B-cell malignancy —
      into solid tumours, and into autoimmune disease.
    opened: 2025-09
    aliases: [car-t-solid, car-t, engineered-cells]
    merged_on: 2026-08-26
    merge_reason: >-
      `car-t-solid` and `cell-therapy` were the same thread under two ids, and the
      2025 evidence made the split untenable: the fastest-growing indication for the
      platform in 2025 was not solid tumours but autoimmunity (lupus, myositis,
      progressive MS), which the solid-tumour claim could not hold.

  - id: single-cell-3d-genome
    claim: >-
      Per-cell-type chromatin conformation and spatial multi-omics become routine
      assay modalities that downstream pipelines and models must ingest.
    opened: 2025-10

  - id: clinical-practice
    claim: >-
      Tracked meetings predict practice-changing readouts months before they publish.
    opened: 2025-10
    note: >-
      The corpus's self-test, not a claim about biology. Podium-to-paper lag is
      estimated at 4-6 months on n=5. Not yet trustworthy.
