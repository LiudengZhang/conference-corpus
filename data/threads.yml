    opened: 2024-04

  - id: clinical-practice
    claim: >-
      Tracked meetings predict practice-changing readouts months before they publish.
    opened: 2024-03
    note: >-
      The corpus's self-test, not a claim about biology. It was measured for the
      first time on 2026-08-26 by scripts/lead_time.py, against AACR and ASCO
      2024 (14,895 abstracts, Crossref) and the journal index running to 2026-08.
      Until then the whole corpus rested on this claim untested, because the
      journal index started at 2025-01 and every conference vault was 2026 — the
      two layers did not overlap enough for a lead to be visible in either
      direction.
    measured: >-
      Podium-to-paper lag is 10-13 months (IQR roughly 7 to 20), and that figure
      is stable across every matching threshold tried, which is the strongest
      part of the result. It replaces the previous estimate of 4-6 months, which
      came from five hand-picked cases and was low by roughly a factor of two.
      The hit rate is the bad news: matching abstract titles to later papers
      gives 0.7% at a Jaccard cutoff of 0.5 against a 0.2% coincidence rate
      measured by running the same matcher against papers published BEFORE the
      meetings. Excess over chance across thresholds runs 0.2 to 1.2 percentage
      points, so of the order of one abstract in a hundred becomes a paper in
      these 33 journals within two years. The meeting leads, and it leads by
      about a year — but as a filter it is close to useless, and any claim that
      a direction was "seen first at a meeting" has to survive the fact that
      roughly 99% of what is said there never arrives.
    negative_result: >-
      The vocabulary version of this claim is refuted outright. Ranking terms by
      how over-represented they are at the meetings relative to the 2024 journals
      predicts 2024-to-2026 journal growth at rho +0.091 once abstract register
      is controlled for, against +0.088 for a null predictor built from a random
      half of the journals' own 2024 output. The gap is 0.003. Reading abstract
      books for emerging vocabulary, as opposed to for specific results, recovers
      nothing the journals did not already contain. The apparent signal before
      controls (+0.168) was abstract shorthand — `mcrpc`, `pts with metastatic`,
      `real world` — which journal titles never use whatever the science does.
