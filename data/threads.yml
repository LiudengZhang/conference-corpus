# Threads — falsifiable claims about where a field is going.
#
#   id          stable slug; never reuse or delete (see aliases)
#   claim       one sentence, falsifiable. Not a topic label.
#   opened      month of the FIRST evidence card on this thread, computed from
#               data/evidence.yml — not asserted, and not the month somebody
#               first noticed the topic.
#   aliases     ids merged into this one; kept so old references never break
#   denominator when the card set is structurally one-sided, what the other
#               side is and how big it is. A thread whose supporting evidence
#               is a genre rather than a set of citable findings cannot be
#               read from its ratio alone, and saying so here is the only
#               thing that stops the ratio from lying.
#
# Status is NOT stored. It is derived from the cards by scripts/build_briefing.py
# every time a briefing is generated, using a rule written down in that file.
# Storing it here would let it drift away from the evidence, which is what
# happened to the first version of this file: every `status` in it was asserted
# from a single month's reading and none of them recomputed.
#
# Rebuilt 2026-08-28 from 1,241 cards; 2023 and 2024 re-scanned from abstracts
# 2026-09-04, now 2,307 cards spanning 2023-01 .. 2026-08.
#
# CARD DENSITY IS COMPARABLE ACROSS 2023, 2024 AND 2026, AND NOT WITH 2025.
# Per thousand research papers read:
#
#     2023  80.4     2024  69.8     2025  24.0     2026  84.8
#
# Three of the four years are now read from abstracts and they agree: 70 to 85
# per thousand. 2025 alone is still title-only at 24.0, and it is the one number
# on this line that describes a reading practice rather than a literature. Do not
# compare a 2025 count with any other year's.
#
# 2023 and 2024 were re-scanned from abstracts on 2026-09-04 with the same
# instrument 2026 was read with: 8,905 and 9,343 research abstracts, 504 and 562
# new cards. 2023 went 25.1 -> 80.4 and 2024 went 10.0 -> 69.8. Two years that
# differed EIGHT-FOLD under the old instrument differ by 13% under the new one.
# Whatever the 2024 trough was, it was not the field being quiet.
#
# The residual 2023/2024 gap is small but it is not nothing, and it has not been
# explained. Do not assume it is signal; four readers per year with a shared brief
# is not four identical instruments, and a 13% spread is about what reader
# variation would produce. Treat 70-85 as one regime.
#
# The title census now has three independent years and the asymmetry holds in
# every one:
#
#     2023   59% hidden    refutations 82%   supports 44%
#     2024   67%           refutations 77%   supports 58%
#     2026   65%           refutations 74%   supports 54%
#
# Audits name their object and trials name their cohort, so what a title hides is
# disproportionately the result that would have counted against something. This is
# now the most replicated finding in the corpus, and it was invisible until the
# instrument was changed and the change was measured against itself.
#
# `status_of` sums supports and refutes over the whole window, so a thread's
# status is dominated by 2023, 2024 and 2026 jointly. Read any status here as a
# statement about those three years with a thin 2025 inside it, and do not read a
# change across the 2024/2025 or 2025/2026 boundary as a change in the field —
# both are instrument boundaries until 2025 is re-scanned.
#
# READ `opened` AS A PROPERTY OF THE WINDOW, NOT OF THE FIELD. It has now been
# recomputed three times, and the reading gets less ambiguous each time:
#
#   floor 2025-08  every thread opened in 2025-08 or just after
#   floor 2025-01  twelve of thirteen moved earlier
#   floor 2024-01  all thirteen moved earlier again; six landed on the floor
#   floor 2023-01  twelve moved earlier again; ELEVEN landed on 2023-01 itself
#
# Eleven of thirteen now sit on the first month that exists. A value that
# relocates to the floor every time the floor is lowered is measuring the
# floor, and three extensions have never once produced an exception that
# survived the next one.
#
# `interception` was described here as the control case — "the only value far
# enough from the edge to carry information", at 2025-01. It is now 2023-01.
# The control did not survive, which means the corpus never had one.
#
# The two threads not on the floor are informative precisely because of how
# they got there. `agentic-ai` (2023-03) is the only thread whose floor is set
# by evidence rather than by the window: three independent readers found zero
# LLM-agent papers across 8,844 titles in 2023-01..2023-09, and the 2026-09-04
# abstract re-scan looked again at the same window with the instrument that sees
# 59% more — 6,772 abstracts, three separate readers — and still found none. The
# near misses are consistently not agents: symptom-inquiry transformers, a
# consultation benchmark, a reasoning tool, ProGen generating proteins, Bayesian
# optimization beating human process engineers. This is the one absence in the
# corpus that survived a change of instrument, which is what makes it a finding
# rather than a floor. The first thing the scan did find is 38030721 (2023-12,
# Nature): a literature-trained language model, active learning and robotics in a
# closed loop synthesizing 41 compounds in 17 days — in materials science, not
# biomedicine. It is carded neutral for exactly that reason. `clinical-practice`
# (2024-03) has no 2023 cards at all, because its claim — that meetings lead
# journals — cannot be evidenced by a journal title in either direction.
#
# The same applies to every "first appearance" claim these notes contain, and
# the record is unambiguous: ten such claims have now been made in this corpus
# and ten have moved earlier on extension, none has ever survived. Treat any
# statement of the form "X appeared first in month M" as shorthand for "no
# earlier instance exists in the months read", which is a fact about reading.
# scripts/check_corpus.py enforces that `opened` matches the cards; nothing can
# enforce that the window is wide enough.
#
# (Two counts in this header were wrong when written and are now computed
# rather than recalled: "eight landed on 2024-01" was six, and the tally of
# retracted first-appearance claims was five, then six, and is now ten. A file
# whose subject is unverified assertion is not exempt from its own subject.)

threads:

  - id: neuro-immune-microbiome-axis
    claim: >-
      Neural, microbial, and lymphoid-structure control of the tumour microenvironment
      are one mechanism network, not three adjacent fields, and neurotransmitters are
      a shared currency between them.
    opened: 2023-01
    aliases: [neuro-immuno-oncology, tls-as-target, microbiome-io, cancer-neuroscience]
    note: >-
      The healthiest thread in the corpus and the one most resistant to being called
      early. Three separate agents flagged it as crowded or peaking (2025-02, 2025-08,
      2025-11) on the grounds of dense publication with no clinical readout. All three
      were wrong so far. The distinction that matters: a direction with negative
      clinical readouts is failing; a direction with no clinical readouts is merely
      untested, and the two look identical from the literature alone.

  - id: foundation-models
    claim: >-
      Scaling data and parameters produces general-purpose models of biology that
      transfer across tasks, individuals and into clinical use.
    opened: 2023-01
    aliases: [virtual-cell, scfm]
    note: >-
      The thread's own negative control was published as a title in 2025-12:
      foundation models in oncology win benchmarks and miss the clinic. On dating
      the vocabulary, see the caution below — an earlier version of this file put
      the arrival of "virtual cell" in these journals at 2025-11, twelve months
      after the Cell challenge. Both halves were wrong. The phrase is in a Nature
      Biotechnology title in 2025-04, two months BEFORE the challenge launched in
      2025-06, and again in Cell in 2025-08. The clause that used to follow —
      "single-cell foundation models were evaluated as a class in 2025-04 and
      2025-06" — was ONE STUDY COUNTED TWICE: the 2025-06 item is a Nature
      Methods research highlight of the Genome Biology evaluation already
      carded in 2025-04. Two months of independent co-presence were one month
      and an echo. Vocabulary and critique are still co-present since spring
      2025, on the remaining evidence.
    dating_caution: >-
      Every "first appearance" claim in this corpus is bounded by which months
      were read. Three moved when 2025-01..07 was backfilled; all moved AGAIN
      when 2024 was added on 2026-08-26, and two more joined them. On
      2026-08-27 the floor moved to 2023-01 and FOUR OF THE SIX DATES THIS
      FIELD RECORDED MOVED A THIRD TIME.
      Superseded here: the LLM-agent-with-tools paper is not 2024-01
      (38799228). It is 2023-12, in Nature — 38123806, autonomous chemical
      research with large language models — with 38127734 in Science three
      weeks later. Clinical-AI limitations are not first stated in 2024-09
      (38965432): Nature Medicine titles say it in 2023-10 (37391665, chatbots
      require approval as medical devices) and 2023-12 (37821686, clinical AI
      must convey per-patient uncertainty), eleven and nine months earlier.
      Two more are not date corrections but attribution corrections, and they
      are worse. The 2024-01 card credited with opening the neuro-immune
      thread (37947393, Cancer Discovery, glioma synaptic plasticity) is a
      research-watch restatement of 37914930, Nature, 2023-11. The 2024-01
      card credited to cell-therapy (38071995, Lancet Oncology, FDA
      investigating secondary lymphomas after CAR-T) restates 38071978, an
      adjacent PMID in the Lancet one month earlier. In both cases the corpus
      opened a thread on the echo rather than the paper.
      That trio is now a pair. Read against its abstract on 2026-08-27,
      38528186 is not an audit: it endorses GPT-4 cell-type annotation as
      accurate, with strong concordance and an R package. It was carded as the
      critique co-published with the models purely on its title. The
      co-presence claim still holds on 38409223 and 38844628, and three
      independent 2023 readers found the same co-presence throughout 2023 — but
      it now rests on two papers rather than three, and one leg of it was an
      artefact of reading titles.
      Assume any such claim is an upper bound on the date, never the date.
      Ten have been made; ten have moved.

  - id: method-credibility
    claim: >-
      Published methods, reference resources and reagents are reliable enough to
      build on without re-checking them.
    opened: 2023-01
    aliases: [reproducibility, self-audit]
    denominator: >-
      Structurally one-sided by construction: this is a ledger of things found
      unreliable, so the derived status is uninformative. "Every card refutes"
      stood here and was already untrue when written; computed on 2026-09-04
      over 370 cards it is 347 refutes, 13 neutral, 10 supports — 94%, not 100%.
      The exceptions are worth keeping visible: a randomized-trial confirmation
      that the SP263 and 22C3 companion diagnostics are interchangeable
      (ev-2023-10-37903590), and benchmarks that vindicated the method they
      tested rather than faulting it. A ledger that cannot record a pass is not
      measuring reliability, it is assuming the answer.
      Read the volume instead — with the denominator attached, because the two
      series in this corpus do not join.
      Over general+bioinfo together, 2025-01..07 runs 1 in 70, 1 in 73, 1 in 44,
      1 in 36, 1 in 33, 1 in 40, 1 in 36: roughly a doubling across the half-year.
      Over bioinfo alone, 2025-06..12 runs 1 in 24, 1 in 21, 1 in 14, 1 in 15,
      1 in 14, 1 in 10. An earlier version of this file quoted the second series
      as if it were the first and reported a monotone 7x rise; the correct
      statement is a doubling on the wide denominator and a further roughly
      doubling on the narrow one, which is still growth but not that growth.
      What survives re-reading unchanged is the escalation of the audit's object:
      from the model, to the pipeline, to the instrument, the wet-lab assay, the
      generative model's own output, and by 2026 the software version number.
    measured_series: >-
      Both series above were produced by readers, not by a rule, and neither can
      be compared across months. On 2026-08-26 scripts/scan_titles.py was run
      over all months read with one written pattern set, giving the first
      comparable series this thread has ever had. As a share of general+bioinfo
      titles: 2024 is 1 in 210 (40 hits / 8,413), 2025 is 1 in 189 (51 / 9,661),
      2026-01..08 is 1 in 102 (75 / 7,633). Aggregate by year, because the
      monthly counts run 1 to 16 and the month-to-month noise swamps everything.
      The correction that matters: 2024 and 2025 are indistinguishable, and the
      roughly two-fold rise happens in 2026. This thread has been asserting a
      doubling ACROSS 2025, and under a consistent rule that doubling is not
      there. The genre grew — a year later than recorded.
      Absolute levels are lower than the reader-derived series because a regex
      catches only direction-stating phrases it was told about; use it for shape
      across months, never as a count of the genre.

  - id: suppressive-population-inversion
    claim: >-
      Depleting or blocking a cell population identified as immunosuppressive
      improves antitumour outcomes.
    opened: 2023-01
    note: >-
      Opened 2026-08-26 by the 2025 backfill. This thread did not exist in the
      version of this file derived from a single month of 2026 reading, and finding
      it is the clearest thing the backfill bought. Nineteen title-stated inversions
      in twelve months, spread across NK cells, pDCs, Tregs, MAIT cells, fibroblasts,
      neutrophils, MDSCs, TIGIT and CD47 — several of them published in the same
      journal and the same month as papers proposing to target the same population.
    denominator: >-
      The supporting side is not carded and cannot be, because it is a genre rather
      than a set of citable findings: the templated preclinical block that nominates
      a suppressive target, deletes it, and reverses immune suppression in mice. It
      runs at roughly 12-33 papers a month across the eight oncology journals.
      Treat the ratio as "documented inversions against a steady stream of
      nominations", never as a bare count against zero.
    counting_caution: >-
      An earlier version of this file gave the block as 55, 35, 23, 30, 19, 11, 14,
      18, 14, 23 for 2025-03..12 and read a decline into it. That series is void.
      Re-counting 2025-01..07 under one consistent written rule gave 12, 17, 33, 13,
      25, 31, 22 — January is 12, not 55. The between-reader spread on a single
      month is as large as the spread across months, so nothing in that series
      supports a trend in either direction. One reader reconstructed how the
      earlier figure was probably built: including therapeutic-payload papers
      alongside target-nomination papers moves a month from 9/22 to 15/28. The
      general lesson for this corpus: a count is only comparable across months if
      the counting rule was written down before the counting, and quoted with the
      number afterwards.

  - id: next-gen-checkpoints
    claim: >-
      Targets beyond PD-1/CTLA-4 deliver a second generation of checkpoint blockade.
    opened: 2023-01
    note: >-
      The measured failure mode is not that individual targets fail — it is that the
      category is dissolving. A novel surface co-inhibitory receptor name has a
      half-life of two to four months in this corpus; ligand-side and intracellular
      nominations last longer. By 2025-12 the new nominations (CLEVER-1, CD300e,
      TIPE2, NEAT1) are macrophage and lncRNA targets rather than T-cell surface
      receptors, and the only clinical-stage non-PD-1 content is B7-H3 and an
      Fc-enhanced CTLA-4 — both from waves preceding the current preclinical set.
      An earlier version of this note asserted that across all of 2025 not one
      newly nominated checkpoint entered a phase 1, and followed it with
      "2025-10 returned zero hits for the entire target list". The second
      sentence is a fact about one month's reading and was never evidence for
      the first. Both are superseded by `registry_check` below, which tested
      the first sentence against the trial registry rather than the literature.
    registry_check: >-
      Checked 2026-08-27 against data/regulatory.sqlite (ct_trials), which did
      not exist when the claim was written. Run three times as the table grew:
      2024-01..2026-08 (5,666 phase-1 oncology trials), then 2023-01..2026-08,
      then 2013-01..2026-08 — 164 months and 18,023 phase-1 oncology trials,
      70,116 trials in all. Every run agrees on the narrow 2025 claim. None of
      them agree on the `denominator` field's list of zeroes, and the third run
      also broke this field's own framing — see `retraction` and `tier_c`. Rule, fixed before counting: phases in PHASE1 /
      PHASE1;PHASE2 / EARLY_PHASE1, onc_conditions=1, binned on
      studyFirstPostDate; target implicated in `title` or `interventions` by
      name or by agent INN; every non-PD-1 hit read individually and classified
      as target-directed or backbone-only. Target list derived from the corpus,
      not from recall: 398 checkpoint-context journal titles and 3,005
      checkpoint-context sentences in the AACR/ASCO 2024 abstracts, plus a sweep
      of every "anti-X / targeting X" string in the registry's own phase-1 rows.
      THE CLAIM SURVIVES, NARROWLY AND ONLY AS STATED ABOUT NEW TARGETS. Of the
      seventeen checkpoint targets this corpus first named inside its window —
      IGSF8, ITPRIPL1, BTN1A1, SLC6A6, LRIG1, Siglec-10, PSGL-1, CISH, CLEVER-1,
      CD300e, TIPE2, NEAT1, CD161/LLT1, GARP, VSIG4, TIM-4, Siglec-E — zero
      entered a phase 1 in 2025. The tier produced four phase-1 registrations in
      44 months: LLT1 (NCT06451497, Zumutor, 2024-06) and CD200AR-L
      (NCT06305910, 2024-03); GARP (NCT06964737, Ohio State, 2025-05); and
      bexmarilimab twice in 2026. Unchanged when binned on start_date.
      ONE TRIAL SITS ON THE LINE. NCT06964737 is an anti-GARP CAR-T posted
      2025-05-09, and GARP/TGFβ is called a checkpoint axis in this corpus's own
      journals (2026-02, twice). It survives the claim only because a CAR using
      GARP as a surface antigen is not checkpoint blockade — a distinction the
      old wording did not make. Read loosely, 2025 also holds COM701 (anti-PVRIG,
      NCT06888921) and GI-108 (anti-CD73, NCT07172802); both targets are older
      than the window, so that reading fails on "newly", not on the data.
    denominator: >-
      Quote this instead of the binary, because it survives the definitional
      argument the binary does not. Excluding B7-H3, which is an ADC/CAR antigen
      rather than a blockade target, the phase-1 pipeline for EVERY non-PD-1
      co-inhibitory checkpoint — prior wave and new together — is 6 trials in
      2024, 6 in 2025 and 4 in 2026-to-August, against 175 PD-1 phase 1s in 2025
      alone. THE SECOND SENTENCE OF THIS FIELD WAS WRONG AND IS RETRACTED. It
      read: "VISTA, NKG2A, IDO1, CD39, HPK1, Siglec-15, TREM2, CD96, B7-H4 and
      MERTK each returned zero phase-1 rows across all 32 months." Five of the
      ten have phase-1 trials, and they were missed two different ways. See
      `retraction` below. The surviving claim is the ratio, not the zeroes.
    retraction: >-
      Re-run 2026-08-27 against 5,666 phase-1 oncology trials over 44 months.
      Two mechanisms, and only one of them is about the window.
      THE WINDOW, AND IT IS WORSE THAN FIRST RECORDED. This field originally
      said VISTA had three phase-1 starts in 2023 and NKG2A two. Extending the
      registry to 2013-01 gives VISTA eight, beginning 2016-02 (JNJ-61610588),
      then CA-170 2016, CI-8993 2020, W0180 2020, HMBD-002 2021 and the three
      in 2023; and NKG2A ten, beginning 2015-01 with monalizumab, eight of them
      before 2023 — including an S095029 phase 1 in 2021-12 that predates the
      two 2023 trials this field credited. IDO1 is the extreme case: 49 phase-1
      starts before 2023, peaking at fourteen in 2017, against one from 2023
      on. The entire IDO1 wave happened before the corpus opened and the corpus
      recorded it as a target with no clinical activity.
      Each widening has made this worse rather than settling it, which is the
      point: a registry that begins in 2024 cannot see a 2016 first-in-human,
      and no amount of care applied inside the window substitutes for the
      window reaching far enough back.
      THE FIELDS, WHICH IS THE WORSE ONE: IDO1 (NCT07732413, 2026-07), TREM2
      (EOS006215, NCT06877533, 2025-03) and B7-H4 (NCT06336707, 2024-03) all
      sit INSIDE the original 2024-01..2026-08 window and were missed anyway,
      because the target is named only in `brief_summary` — a field the harvest
      did not store when the claim was made. So this was not a window error at
      all. It was a claim about the world made from the columns that happened
      to be in the table.
      A THIRD MECHANISM, FOUND 2026-08-27 AND THE ONLY ONE STILL LIVE.
      MERTK was listed here as genuinely zero. It has two phase-1 trials,
      NCT06525246 (2024-07) and NCT06532331 (2024-08), both ONO-7475 from Ono.
      Both sit INSIDE the original 2024-01..2026-08 window, so this is neither
      a window failure nor a missing-field failure: the string "MERTK" appears
      nowhere in either record, because the agent is named only by its sponsor
      code. Code-name opacity is a distinct third way this thread has been
      wrong, it is the one the corpus has no fix for yet, and it is what
      data/code_names.tsv exists to attack.
      CD39, HPK1, Siglec-15 and CD96 stay at zero inside the window. CD39's
      only hit, NCT05902520, uses CD39 to select tumour-reactive TIL — a
      biomarker, not a target — which a keyword count scores and a reader
      catches. But the zeroes should not be read as "unclinical": over 164
      months CD39 has eight anti-CD39 phase 1s in 2019-2022, HPK1 four in
      2019-2021, Siglec-15 two, CD96 one. The targets were clinical before the
      corpus was.
      The Tier C result is unchanged and has now survived a second test: no
      newly nominated checkpoint entered a phase 1 in 2025, and the widened
      window adds no 2023 Tier C registrations either.
    tier_c: >-
      THE PHRASE "FIRST NAMED INSIDE ITS WINDOW" WAS BEING READ AS "NEW". It
      does not mean that. Extending the registry to 2013-01 shows four of the
      seventeen were already in phase 1 years before this corpus opened:
      CLEVER-1 (FP-1305/bexmarilimab, 2018-11), GARP (livmoniplimab 2019-01,
      DS-1055a 2020-06, HLX60 2022-11), BTN1A1 (NC762 2021-05, hSTC810
      2022-02) and CISH (CISH-inactivated TIL, 2020-06). For those four,
      "newly nominated" recorded only that the corpus arrived late. Over 164
      months the tier holds 19 phase-1 registrations, not four.
      What survives, and it is the strongest part of the thread: twelve of the
      seventeen are absolute zeros across all 164 months — IGSF8, ITPRIPL1,
      SLC6A6, LRIG1, Siglec-10, PSGL-1, CD300e, TIPE2, NEAT1, VSIG4, TIM-4,
      Siglec-E. Fourteen years of registry and not one phase 1 between them.
      The narrow claim — no newly nominated checkpoint entered a phase 1 in
      2025 — is about 2025 and is untouched by any of this.
    blind_spot: >-
      REDUCED FROM 42% TO 34%, NOT CLOSED. Storing brief_summary and the
      arm-group fields on 2026-08-27 closed 112 of 612 opaque trials; of
      1,473 phase-1 oncology trials first posted in 2025, 500 still name
      nothing but a bare code. brief_summary did almost all the work (173
      trials legible on that field alone) and arm_interventions did none,
      being fully redundant with the flat interventions column.
      Twenty survivors were read individually and are genuinely opaque —
      SHR-4394, HS387, BI 765049, MB0151, KK2845, MK-4716 — code-named
      programmes whose summaries state only safety, tolerability and PK. So a
      first-in-human antibody against a newly nominated checkpoint can still
      hide here, and one third of the 2025 phase-1 field is still dark. The
      retraction above is what that darkness looks like when it is measured
      rather than assumed away.
      THE MEETING LAYER DOES NOT FIX IT, AND THAT WAS THE HYPOTHESIS. Since 45
      development code names had been recoverable from AACR/ASCO abstract text
      and none from FDA announcements, the meeting layer looked like the
      decoder for exactly this dark interval. data/code_names.tsv was built to
      test that — 177 validated code-to-INN pairs at roughly 99% precision,
      from 29,168 full-text abstracts.
      It closes ONE of the 465 dark trials. The reason is the finding, not the
      yield: those trials name 266 distinct codes, of which 40 appear anywhere
      in four years of AACR and ASCO, 16 sit near any INN-shaped word, and 1
      has a validated INN. The two populations are near-disjoint, and where
      they do overlap the agent has no INN yet — the meeting is inside the same
      dark interval, not ahead of it. No improvement in extraction reaches
      this, because the name does not exist to be extracted.
      The decoder is kept for the retrospective direction it is genuinely good
      at: reading old abstracts and pre-INN registrations, and establishing
      cross-licensing identity such as SKB264 = MK-2870, which a registry query
      on either code alone will not return. Its coverage is a function of drug
      age by construction, so it will always be strongest on the drugs that no
      longer need decoding.

