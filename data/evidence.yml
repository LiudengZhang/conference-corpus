  revised: 2026-08-27
  revised_note: >-
    Fabricated from a title pun, and withdrawn. The claim said a chromatin mark
    had been reassigned across the published record, invalidating prior work
    that used it. The paper's entire abstract is one sentence — "The
    specialized packaging of sperm DNA preserves genome stability in the fruit
