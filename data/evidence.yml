# 2023, added 2026-08-27 when the index floor moved from 2024-01 to 2023-01.
#
# 229 cards, read by four readers working a quarter each against titles only —
# the index carries no abstracts — under one written brief. Every pmid, date and
# title was copied from the index rather than retyped, which is why they agree.
#
# Read in arrears, by readers who already knew what 2024-2026 did. That is the
# opposite of what the monthly practice simulates, and it is the reason the
# brief forbade the words "first" and "earliest" outright: a first-appearance
# claim written from here would be a statement about where reading began. The
# same instruction was given for 2024 and six such claims still had to be
# retracted, so treat these twelve months as a baseline for the threads rather
# than as a record of what was visible at the time.
#
# One thread, clinical-practice, has no 2023 cards at all. That is a finding and
# not a gap: its claim is that meetings lead journals, which a journal title
# cannot evidence in either direction. It needs the conference layer joined to
# the index, and padding it from titles would have manufactured exactly the lead
# it exists to test.
