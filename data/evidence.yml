- id: ev-2026-07-42478469
  pmid: "42478469"
  date: 2026-07-21
  source: cancer-discovery
  threads: [cell-therapy]
  stance: supports
  type: approval
  claim: >-
    The first CAR-T product approved anywhere for a solid tumour: satricabtagene
    autoleucel, targeting Claudin18.2, cleared by China's NMPA on 2026-06-22 for
    Claudin18.2-positive HER2-negative advanced gastric and gastro-oesophageal
    junction adenocarcinoma after at least two prior lines. Not an FDA approval —
    the FDA's seven approved CAR-T products remain haematological, and its only
    engineered-cell approval in a solid tumour is lifileucel, a TIL therapy, in
    February 2024.
  title: >-
    First CAR T-Cell Therapy Approved for Solid Tumors
  resolved: 2026-08-26
  resolution: >-
    Opened as `verify` because the product name and regulatory record could not
    be located from the headline. Settled against the sponsor's approval notice
    (CARsgen, 2026-06-22) and cross-checked against the FDA's approved cellular
    and gene therapy list, which does not contain it. The qualification matters:
    the headline is true worldwide and false for the United States, and a card
    that recorded only the headline would have put an FDA approval on this thread
    that does not exist. See source `r-fda-cellular-gene-therapy`.
