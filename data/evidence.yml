# Evidence cards - one addressable finding each.
#
#   id          stable slug: ev-<YYYY-MM>-<pmid>. Never reuse.
#   pmid        join key to data/index.sqlite (the L1 reading index).
#   date        taken from the index, NOT from whoever reported the paper.
#               PubMed [dp] matches both the ahead-of-print and the issue date,
#               so 18% of records are returned by two different months' queries.
#               Binning on a single date field is the only way to avoid double
#               counting - this cost us seven mis-dated claims before it was caught.
#   threads     thread ids from data/threads.yml
#   stance      supports | refutes | neutral   <- REQUIRED
#               Without it a thread page only ever accumulates confirmation.
#   type        mechanism | clinical-readout | benchmark | refutation | approval |
#               podium-to-paper | new-modality | meta
#   claim       one sentence. Not the title.
#   revised     date a card was corrected after the fact; absent on cards that
#               have never been changed. A silently repaired card is
#               indistinguishable from one that was always right.
#   revised_note what was wrong. Required whenever `revised` is set.
#
# THE TRIAL-TITLE RULE, adopted 2026-08-27:
#
#   A CLINICAL-TRIAL TITLE MAY NEVER SUPPORT A `refutes` CARD WITHOUT THE
#   ABSTRACT.
#
# Trial titles name the trial, the drugs, the population and the phase. By
# convention they do not name the endpoint or whether it was met. A reading
# brief that ranks refutations first — which is how 2023 and much of 2025-2026
# were read, and which the briefings disclose — therefore does not merely
# over-select null results from that genre. It MANUFACTURES them, because the
# reader supplies the missing outcome and the brief tells them which way to
# supply it. That is a sign error, not a sampling one, and no denominator
# caveat corrects it.
#
# Measured, not assumed: all 712 cards were read against their PubMed abstracts
# on 2026-08-27 (see _Temp/title-floor.md). 17 cards had their sign wrong.
# Six of the 17 are this exact shape — a trial carded `refutes` whose abstract
# reports a positive result — and only one reversal runs the other way. This
# one rule would have prevented a third of the reversals in the corpus.
#
# The same reading measured the instrument itself: against a seeded 300-paper
# control of 2023 papers never carded and never cited, between 25% and 53% of
# cardable findings are invisible in a title. Titles under-report, and the
# genres they under-report worst are trials, which hide the endpoint, and
# audits, whose titles name the object ("Evaluation of X") while the abstract
# names the verdict.
#
# Built 2026-08-25 from a 7-month scan of 33 journals (9,035 deduplicated
# research articles). Cards are curated, not exhaustive: the triage surfaced
# roughly 660 refutation-flagged items across Jan-Jun alone.

