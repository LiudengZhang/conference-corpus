# ---------------------------------------------------------------- foundation models

- id: ev-2026-07-scfm-scaling-null
  date: 2026-07
  pmid: "42265212"
  companions: ["42265208", "42443524", "42475685", "42412799", "42260311", "42521815"]
  source: nature-methods
  thread: [foundation-models]
  stance: refutes
  type: benchmark
  claim: >-
    Scaling training data does not buy single-cell foundation model performance; the same
    month, protein language model size stopped predicting fitness accuracy, nucleotide
    transformers were shown to carry systematic context bias, standard train/test splits
    were shown to leak sequence composition and inflate reported accuracy, and two groups
    showed sequence-to-function models fail on inter-individual variation.
  confidence: high
  note: >-
    Seven independent papers across Nature Methods, Nature Computational Science, NAR,
    Bioinformatics and Molecular Systems Biology in one month. This is a coordinated
    refutation wave, not a scattering of negative results. THE AUTHOR-TRACKING ROUTE FOUND
    NONE OF IT — see ev-2026-07-method-blind-spot.

- id: ev-2026-07-cellular-memory-ceiling
  date: 2026-07
  pmid: "42242211"
  companions: ["42462718", "42320478", "42335896", "42320477"]
  source: cell-systems
  thread: [foundation-models]
  stance: refutes
  type: mechanism
  claim: >-
    Single-cell response is determined by heritable non-genetic state and prior exposure
    history rather than by genotype or noise, so expression state alone is an insufficient
    input for perturbation prediction.
  confidence: medium
  note: >-
    A biological argument against the virtual-cell program rather than an empirical one, and
    therefore harder to fix by better data. Reinforces ev-2026-07-scfm-scaling-null.

- id: ev-2026-07-clinical-fm-shipped
  date: 2026-07
  pmid: "42538427"
  companions: ["42486902", "42443444"]
  doi: 10.1038/s41591-026-04502-7
  source: nature-medicine
  thread: [foundation-models]
  stance: supports
  type: clinical-readout
  claim: >-
    Clinical foundation models shipped at scale in July — Compass (pan-cancer immunotherapy
    response from bulk transcriptomes via a 44-concept bottleneck transformer), PRISM2
    (2.3M whole-slide images, 14M QA pairs), and CLEAR (concept-grounded radiology FM built
