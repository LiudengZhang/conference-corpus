# ---------------------------------------------------------------------------
# 2026, re-scanned from abstracts on 2026-08-28. 440 cards, added to the 146
# written from titles.
#
# Every card in this corpus before today was written from a title, because the
# index held no abstracts. A 300-paper control measured the cost and estimated
# that a quarter of cardable findings were invisible to a title. Scanning all
# 7,962 research abstracts of 2026 turned that estimate into a census, and the
# census is worse: 277 of 440, sixty-three per cent.
#
# `title_sufficient` records, per card, whether the stance could have been
# reached from the title and journal alone. The split is the finding:
#
#     refutations   74% invisible to a title
#     supports      54%
#
# Titles hide refutations at about 1.4x the rate they hide supporting results,
# because of genre. An audit names its object and not its verdict — "a
# technical comparison of spatial transcriptomics platforms" does not say the
# platforms disagree. A trial names its cohort and not its outcome. Those are
# the two genres refutations live in.
#
# This corpus already knew it under-collected refutations; that is why
# method-credibility carries a `denominator` note. What it did not know is that
# the instrument was preferentially hiding them. Two independent biases were
# pointing the same way, and only one of them was documented.
#
# 2023-2025 have NOT been re-scanned. Their layers remain title-read and are
# roughly half their true height, so card counts are not comparable across
# 2026 and earlier years. That discontinuity is deliberate — 2026 is where the
# instrument changes, and every month from here is read with abstracts.
# ---------------------------------------------------------------------------

