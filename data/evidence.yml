- id: ev-2026-07-podium-lag-n5
  date: 2026-07
  source: internal
  thread: [clinical-practice]
  stance: neutral
  type: meta
  claim: >-
    Measured lag from invited conference talk to the corresponding paper is 4-6 months across
    five forward links (Fridman 5, Jaffee 5, Galsky 5, Powles 4, Chen 6), plus one inverse
    case where the paper preceded the keynote by 9 days.
  confidence: low
  verify: true
  note: >-
    n=5, all from a single month, all found after the fact. Must be re-measured against
    August and September before being treated as a planning number.

- id: ev-2026-07-method-blind-spot
  date: 2026-07
  source: internal
  thread: [clinical-practice, foundation-models]
  stance: neutral
  type: meta
  claim: >-
    Author-tracking found five podium-to-paper links and zero refutations. Full-journal
    scanning found more than a dozen refutations and zero podium links. The two routes have
    complementary structural blind spots.
  confidence: high
  note: >-
    The mechanism is not accidental. People who publish benchmarks and negative results are
    not the people invited to give keynotes — partly because they are refuting the keynote
    speakers. An author-tracked corpus will therefore confirm its own priors indefinitely.
    This is the single most important finding of the July pilot.

