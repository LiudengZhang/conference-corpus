    42092351 in the same corpus ("indistinguishable from the background in most
    cancer types ... however, in orodigestive tumors"). Those two cards were
    revised in opposite directions on the same day, each note calling the other
    reading the error. They report one result and now carry one stance.
    It is `refutes` because this thread claims a general mechanism network, and
    a microbial arm confined to sites with mucosal contact constrains that
    generality rather than evidencing it. The mechanism is not in doubt where
    it exists; its reach is.

