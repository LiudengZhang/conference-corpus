# Evidence cards — one addressable finding each.
#
#   id          stable slug. Referenced by threads.yml and by briefings. Never reuse.
#   date        publication date, or the month when a card covers a cluster
#   pmid/doi    at least one. pmid is the join key to the L1 index.
#   source      journal slug
#   thread      one or more thread ids from data/threads.yml
#   stance      supports | refutes | neutral   <- REQUIRED. Without it a thread page
#               only ever accumulates confirmation.
#   type        mechanism | clinical-readout | benchmark | refutation | approval |
#               podium-to-paper | programming-signal | new-modality | meta
#   claim       one sentence. Not a title.
#   companions  other PMIDs making the same claim in the same window. A cluster is a
#               first-class object, not n separate cards.
#   prior_podium  only when a tracked speaker presented this before publishing it
#   anchor      docs-relative path + anchor, when the corpus already says something
#   confidence  high | medium | low
#
# Built 2026-08-25 from the July 2026 full scan (1,795 research articles, 33 journals)
# plus the author-tracking run over data/speakers.yml.

