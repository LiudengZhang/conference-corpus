# Evidence cards - one addressable finding each.
#
#   id          stable slug: ev-<YYYY-MM>-<pmid>. Never reuse.
#   pmid        join key to data/index.sqlite (the L1 reading index).
#   date        taken from the index, NOT from whoever reported the paper.
#               PubMed [dp] matches both the ahead-of-print and the issue date,
#               so 18% of records are returned by two different months' queries.
#               Binning on a single date field is the only way to avoid double
#               counting - this cost us seven mis-dated claims before it was caught.
#   threads     thread ids from data/threads.yml
#   stance      supports | refutes | neutral   <- REQUIRED
#               Without it a thread page only ever accumulates confirmation.
#   type        mechanism | clinical-readout | benchmark | refutation | approval |
#               podium-to-paper | new-modality | meta
#   claim       one sentence. Not the title.
#
# Built 2026-08-25 from a 7-month scan of 33 journals (9,035 deduplicated
# research articles). Cards are curated, not exhaustive: the triage surfaced
# roughly 660 refutation-flagged items across Jan-Jun alone.

