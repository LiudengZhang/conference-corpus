    direction — "our findings demonstrate how single-cell technologies can be
    applied for early detection and diagnosis of this fatal disease" — while
    also placing initiation in utero. It re-times the driver events; it
    neither treats a precursor state nor shows interception failing, so it
    should sit on neither side of the ratio.

