- id: ev-2025-04-39786370
  pmid: "39786370"
  date: 2025-04-02
  source: cancer-discovery
  threads: [neuro-immune-microbiome-axis]
  stance: supports
  type: clinical-readout
  claim: >-
    Non-selective but not beta1-selective adrenergic blockade delays platelet
    engraftment and reduces survival after allogeneic transplant in patients
    and in mice — sympathetic signalling is load-bearing in human recovery.
  title: >-
    Nonselective β-Adrenergic Receptor Inhibitors Impair Hematopoietic
    Regeneration in Mice and Humans after Hematopoietic Cell Transplants
  companions: ["40170537"]
  revised: 2026-08-27
  revised_note: >-
    Stance reversed refutes->supports, and the "neural axis cutting against an
    intervention built on it" gloss dropped: no intervention built on the axis
    was tested. Carvedilol and metoprolol are cardiac drugs, and the finding
    is that blocking beta2/beta3 signalling — but not beta1 — impairs
    engraftment in two patient cohorts. That is neural control of a
    haematopoietic-immune process demonstrated in humans, which evidences the
    thread's mechanism claim rather than contradicting it. The setting is
    transplant engraftment, not a tumour microenvironment.

