  title: >-
    Feature selection methods affect the performance of scRNA-seq data
    integration and querying
  revised: 2026-08-27
  revised_note: >-
    Stance reversed refutes->supports. The title names the object ("methods
    affect performance") and was read as a finding of unreliability; the
    abstract states the verdict the other way — "We reinforce common practice
    by showing that highly variable feature selection is effective for
    producing high-quality integrations" — and the paper's output is guidance,
    not a defect report. This is the audit genre the corpus warns about, with
    the sign running the unexpected way: an audit that clears the method.

