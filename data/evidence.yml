    inhibits host defense against helminth infection
  revised: 2026-08-27
  revised_note: >-
    Stance reversed refutes->supports. The card read "inhibits host defense"
    as the axis failing, but the thread's claim is mechanistic — that neural
    and lymphoid control are one network with neurotransmitters as the shared
    currency — and says nothing about which direction the effect runs. A
    neuron-ILC2 circuit signalling through IL-13 and beta-CGRP evidences that
    claim whichever way it points. Recorded here because the setting is
    helminth infection, not a tumour microenvironment.

