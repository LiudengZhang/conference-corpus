    contradiction the first one created. It was originally carded `refutes` on
    the claim that published tumour-microbiome signatures are contamination
    artifacts that do not reproduce — which the paper never assesses — and was
    corrected to `supports` because PRISM recovers consistent signatures. That
    read only the positive half of a two-part result. The abstract says
    consistent signatures in gastrointestinal, head-and-neck and urogenital
