# Source registry — the dispatch layer for the info corpus.
#
# One entry per source. Vaults hold judgment; this file holds dispatch.
# `scripts/build_registry.py` reads this and generates docs/registry/*.md.
#
# FIELDS
#   id        stable slug, also the vault directory name where one exists
#   name      human-readable
#   pubmed    journals only: the PubMed abbreviation the index stores in
#             `papers.journal`, which is what makes a journal source joinable
#             to the store that backs it. Copied from the index, not derived
#             from the name by rule — "Bioinformatics (OUP)" is "Bioinformatics"
#             and no rule gets you there. null where the source has no PubMed
#             identity at all, which today means bioRxiv alone.
#   type      conference | webinar | journal | news | regulatory | author-tracking
#   cadence   annual | biennial | monthly | weekly | continuous | one-time
#   start/end ISO dates. null when unscheduled. For continuous sources, omit.
#   topics    from the taxonomy below; drives the by-topic view
#   access    open | mixed | gated | dead   (how hard is the material to get)
#   harvest   method + endpoint. This is the operational payload of the file.
#   vault     docs-relative path, or null if no vault exists yet
#   status    built | partial | scaffold | harvested | none
#             `harvested` means the source has rows in the store for its type:
#             journals in data/index.sqlite, conferences in conference.sqlite,
#             news in news.sqlite, regulatory in regulatory.sqlite. It is the
#             only status that is checkable rather than asserted, and the only
#             one a generator should trust — and as of 2026-08-27
#             scripts/check_corpus.py actually checks it, in both directions,
#             for all four store-backed types. Journals joined last, once
#             `pubmed` gave them a key: this file names them in full ("Nucleic
#             Acids Research") and the index stores abbreviations ("Nucleic
#             Acids Res"), so until that field existed nothing could be joined.
#
#             `harvested` and `built` are different axes, not stages of one.
#             Harvested means the material is in a store; built means a vault
#             page has been written about it. A source can be either without
#             the other, and nine built vaults hold no harvested abstracts.
#   verify    true when a field here is unconfirmed and needs checking
#
# TAXONOMY (keep small on purpose)
#   oncology-clinical, immuno-oncology, single-cell-spatial, ai-ml,
#   foundation-models, imaging, genomics, bioinfo-tools, industry-finance
#
# Dates below were read from each vault's own index.md on 2026-08-25.

meta:
  updated: 2026-08-26
  taxonomy:
    oncology-clinical: Clinical oncology and trial readouts
    immuno-oncology: Immunotherapy, checkpoint, cell therapy
    single-cell-spatial: Single-cell and spatial omics
    ai-ml: Machine learning methods and venues
    foundation-models: Foundation models and virtual cells
    imaging: Medical imaging and computational pathology
    genomics: Human and clinical genetics, sequencing
    bioinfo-tools: Workflow platforms, packages, infrastructure
    industry-finance: Company strategy, financing, launches

sources:

# ────────────── Conferences: 2023 and 2024, harvested as the control ─────────
# These four are not here to be read. They are here because every other
# conference in this file is 2026, and a meeting cannot be shown to lead the
# literature by three months. AACR and ASCO are far enough back that the
# literature has had time to answer them, which is what makes
# scripts/lead_time.py possible.
#
# 2023 was added on 2026-08-27, when the journal index was extended to
# 2023-01. It is the better cohort and exists to answer a question the 2024
# pair cannot: with about three and a half years of follow-up against a
# 10-13 month lag, versus two and a third, is that lag a property of the
# field or of the single year it was first measured in?

- id: aacr-2023
  name: AACR Annual Meeting 2023
  type: conference
  cadence: annual
  start: 2023-04-14
  end: 2023-04-19
  location: Orlando, FL
  topics: [oncology-clinical, immuno-oncology, single-cell-spatial, ai-ml]
  access: open
  harvest:
    method: crossref
    endpoint: "https://api.crossref.org/journals/1538-7445/works?filter=from-pub-date:2023-01-01,until-pub-date:2023-12-31"
    notes: >-
      Same route as 2024 — the Cancer Research supplement, Annual Meeting
      isolated on DOIs containing `am2023`. 6,386 of 8,733 records for the
      year, full abstract text on every one.
  vault: null
  status: harvested

- id: asco-2023
  name: ASCO Annual Meeting and symposia 2023
  type: conference
