  harvest:
    method: crossref
    endpoint: "https://api.crossref.org/journals/1527-7755/works?filter=from-pub-date:2023-01-01,until-pub-date:2023-12-31"
    notes: >-
      JCO supplement, 7,306 abstracts. Same shape as 2024: the June block is
      the Annual Meeting, February is the GI and GU symposia. Full text on
      every one.
  vault: null
  status: harvested

