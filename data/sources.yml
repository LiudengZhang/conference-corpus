# ---------------------------------------------------------------------------
# Regulatory. Not read monthly; queried when an evidence card claims an
# approval, a label change, or a programme discontinuation. The corpus has one
# open `verify` flag of exactly this kind, which is the reason these exist.

- id: r-fda-oncology-approvals
  name: FDA Oncology (OCE) approval notifications
  type: regulatory
  cadence: continuous
  topics: [oncology-clinical]
  access: open
  harvest:
    method: static-html
    endpoint: "https://www.fda.gov/drugs/resources-information-approved-drugs/oncology-cancer-hematologic-malignancies-approval-notifications"
    notes: >-
      Authoritative for first-approval claims; check before carding one.
      Trap: the table's Date column is the *posting* date, not the approval
      date. Each notice restates the real date in its prose and the two
      disagree on 7 of 190 rows — treosulfan was approved 2025-01-21 and
      posted 2025-02-06, which files it under the wrong month. The harvester
      dates from the prose and keeps the column as posted_date.
  vault: null
  status: harvested

- id: r-fda-cellular-gene-therapy
  name: FDA approved cellular and gene therapy products
  type: regulatory
  cadence: continuous
  topics: [immuno-oncology]
  access: open
  harvest:
    method: static-html
    endpoint: "https://www.fda.gov/vaccines-blood-biologics/cellular-gene-therapy-products/approved-cellular-and-gene-therapy-products"
    notes: >-
      The list that settles any "first CAR-T approved for X" question.
      Carries no dates — it is a state roster of 53 products, not an event
      stream, and is stored with a `captured` date and deliberately no
      month column so it cannot be joined into a monthly query by accident.
  vault: null
  status: harvested

- id: r-ema-medicines
  name: EMA medicines register
  type: regulatory
  cadence: continuous
  topics: [oncology-clinical]
  access: open
  harvest:
    method: xlsx-export
    endpoint: "https://www.ema.europa.eu/system/files/documents/report/medicines-output-medicines-report_en.xlsx"
    notes: >-
      The /en/medicines page previously named here is a JavaScript shell and
      yields nothing. The nightly xlsx export is the real route: 2,339 human
      medicines, marketing-authorisation dated, 553 flagged oncology by MeSH
      area or ATC L01/L02. Trap: a second EPAR spreadsheet under
      /system/files/ also returns 200 but was last generated December 2023
      and carries no date columns.
  vault: null
  status: harvested

- id: r-clinicaltrials-gov
  name: ClinicalTrials.gov
  type: regulatory
  cadence: continuous
  topics: [oncology-clinical, immuno-oncology]
  access: open
  harvest:
    method: api
    endpoint: "https://clinicaltrials.gov/api/v2/studies"
    notes: >-
      Used to check whether a nominated target has any registered trial. The
      finding that no newly nominated checkpoint entered a phase 1 anywhere in
      2025 was read off the literature only; it was confirmed against this
      source on 2026-08-27 and survives, but only as a claim about targets the
      corpus first named inside its own window. See `registry_check` on the
      next-gen-checkpoints thread, which records the rule, the one borderline
      trial, and the 42% of phase-1 rows whose target is only a code name.
      Dated on studyFirstPostDate. Trap: query.cond matches free text across a
      record's entire condition list, so a COPD rehabilitation study that
      lists "Lung Neoplasms" fourth comes back as oncology. Every row carries
      an onc_conditions flag instead. Widened twice on 2026-08-27, first to
      2023-01 and then to 2013-01: 70,116 trials over 164 months, 18,023 of
      them phase-1 oncology.
      The harvester now chunks by calendar year, because the whole-window count
      is 70,116 against a 40,000 cap and a one-shot run would have silently
      narrowed to Phase 1/2/3 — leaving early years phase-filtered and late
      years not, so every combined count would compare two populations. The cap
      is now per-chunk and crossing it REFUSES the chunk rather than narrowing
      it: a missing chunk is a visible hole, a narrowed one is invisible. A
      ct_chunks table records whether any chunk was narrowed, so the question
      is answered from the database rather than from a note a later run
      overwrites.
      Also fixed a latent data-loss bug found while chunking: this path used to
      DELETE the whole table and re-INSERT, so a run dying midway left the
      table emptier than it found it. It is a merge now.
  vault: null
  status: harvested

# ---------------------------------------------------------------------------
# Author tracking. The measured alternative to journal scanning: 84 works for
# 35 tracked people in one month, against ~2,900 records for journal-and-subject
# subscription — a ~29x reduction that also surfaced five podium-to-paper links
# the journal route could not. It covers preprints in the same call. Its blind
# spot is structural and permanent: people who publish refutations are not the
# people invited to keynote, so this route finds convergence and never finds
# the contradiction. Run both.

- id: a-openalex-authors
  name: OpenAlex author works
  type: author-tracking
  cadence: monthly
  topics: [oncology-clinical, immuno-oncology, ai-ml, foundation-models]
  access: open
  harvest:
    method: api
    endpoint: "https://api.openalex.org/works?filter=author.id:<id>,from_publication_date:<date>"
    notes: >-
      Resolve people via /authors?search= first. Do not trust the returned
      `authorships` institution blindly — wrong on 3 of 22 spot-checked records.
      Watchlist is data/speakers.yml.
      Two further traps, both hit on 2026-08-26 when this was first run.
      `last_known_institutions[].name` is always null — the key is
      `display_name` — so reading the documented-looking key makes the
      affiliation matcher return zero matches for everyone while appearing to
      work. And OpenAlex now meters by DAILY SPEND rather than request rate: a
      single pass over 65 people with works pagination exhausts the free budget
      until midnight UTC, and backoff does nothing against a quota. Europe PMC
      is the route that runs.
  vault: null
  status: partial

- id: a-biorxiv
  name: bioRxiv / medRxiv
  type: author-tracking
  cadence: continuous
  topics: [genomics, single-cell-spatial, ai-ml]
  access: open
  harvest:
    method: api
    endpoint: "https://api.biorxiv.org/details/biorxiv/<from>/<to>"
    notes: >-
      Reached incidentally through the OpenAlex author route. Direct polling is
      only worth it for a named watchlist; unfiltered volume is unreadable.
  vault: null
  status: none

- id: a-europepmc
  name: Europe PMC
  type: author-tracking
  cadence: monthly
  topics: [oncology-clinical, genomics]
  access: open
  harvest:
    method: api
    endpoint: "https://www.ebi.ac.uk/europepmc/webservices/rest/search"
    notes: >-
      Promoted from fallback to primary author route on 2026-08-26, when
      OpenAlex's daily spend quota made it unusable. Query
      AUTH:"Full Name" AND FIRST_PDATE:[from TO to], paginate on cursorMark.
      Affiliation is deliberately NOT in the query: Europe PMC matches AFF
      against the raw affiliation string, and acronyms behave erratically —
      `UCSF` returns 81 records for one speaker where `MSKCC` returns 4 against
      183 for "Memorial Sloan". Filtering on it drops most of a person's output.
      Consequence: `works` counts are upper bounds and include homonyms, but
      `in_corpus` counts are sound, because a same-named stranger rarely
      publishes in these 33 journals. Run: scripts/track_authors.py.
      First full run: 65 speakers, 2,518 works since 2024-01-01, 407 of them
      (16%) in the index — 1.1% of the corpus from 65 queries against the 1,056
      journal-months the full scan costs.
  vault: null
  status: harvested
