# Source registry — the dispatch layer for the info corpus.
#
# One entry per source. Vaults hold judgment; this file holds dispatch.
# `scripts/build_registry.py` reads this and generates docs/registry/*.md.
#
# FIELDS
#   id        stable slug, also the vault directory name where one exists
#   name      human-readable
#   type      conference | webinar | journal | news | regulatory | author-tracking
#   cadence   annual | biennial | monthly | weekly | continuous | one-time
#   start/end ISO dates. null when unscheduled. For continuous sources, omit.
#   topics    from the taxonomy below; drives the by-topic view
#   access    open | mixed | gated | dead   (how hard is the material to get)
#   harvest   method + endpoint. This is the operational payload of the file.
#   vault     docs-relative path, or null if no vault exists yet
#   status    built | partial | scaffold | harvested | none
#             `harvested` means the source is in data/index.sqlite. It is the
#             only status that is checkable rather than asserted, and the only
#             one a generator should trust.
#   verify    true when a field here is unconfirmed and needs checking
#
# TAXONOMY (keep small on purpose)
#   oncology-clinical, immuno-oncology, single-cell-spatial, ai-ml,
#   foundation-models, imaging, genomics, bioinfo-tools, industry-finance
#
# Dates below were read from each vault's own index.md on 2026-08-25.

meta:
  updated: 2026-08-26
  taxonomy:
    oncology-clinical: Clinical oncology and trial readouts
    immuno-oncology: Immunotherapy, checkpoint, cell therapy
    single-cell-spatial: Single-cell and spatial omics
    ai-ml: Machine learning methods and venues
    foundation-models: Foundation models and virtual cells
    imaging: Medical imaging and computational pathology
    genomics: Human and clinical genetics, sequencing
    bioinfo-tools: Workflow platforms, packages, infrastructure
    industry-finance: Company strategy, financing, launches

sources:

# ─────────────────── Conferences: 2024, harvested as the control ─────────────
# These two are not here to be read. They are here because every other
# conference in this file is 2026, the journal index only reaches 2026-08,
# and a meeting cannot be shown to lead the literature by three months.
# AACR and ASCO 2024 are far enough back that the literature has had two
# years to answer them, which is what makes scripts/lead_time.py possible.

- id: aacr-2024
  name: AACR Annual Meeting 2024
  type: conference
  cadence: annual
  start: 2024-04-05
  end: 2024-04-10
  location: San Diego, CA
  topics: [oncology-clinical, immuno-oncology, single-cell-spatial, ai-ml]
  access: open
  harvest:
    method: crossref
    endpoint: "https://api.crossref.org/journals/1538-7445/works?filter=from-pub-date:2024-01-01,until-pub-date:2024-12-31"
    notes: >-
      Abstracts deposit into the Cancer Research supplement. That ISSN also
      carries the AACR special conferences, so the Annual Meeting is isolated
      on DOIs containing `am2024` — 7,326 of the 11,114 records for the year.
      Full abstract text present on every one. scripts/harvest_conference.py.
  vault: null
  status: harvested

- id: asco-2024
  name: ASCO Annual Meeting and symposia 2024
  type: conference
  cadence: annual
  start: 2024-05-31
  end: 2024-06-04
  location: Chicago, IL
  topics: [oncology-clinical, immuno-oncology]
  access: open
  harvest:
    method: crossref
    endpoint: "https://api.crossref.org/journals/1527-7755/works?filter=from-pub-date:2024-01-01,until-pub-date:2024-12-31"
    notes: >-
      JCO supplement. 7,569 abstracts: the June block is the Annual Meeting,
      January and February are the GI and GU symposia, which are kept because
      they are the earliest oncology readouts of any year.
  vault: null
  status: harvested

