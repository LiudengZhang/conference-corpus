    method: crossref
    endpoint: "https://api.crossref.org/journals/1538-7445/works?filter=from-pub-date:2024-01-01,until-pub-date:2024-12-31"
    notes: >-
      Abstracts deposit into the Cancer Research supplement. That ISSN also
