# ---------------------------------------------------------------------------
# Author tracking. The measured alternative to journal scanning: 84 works for
# 35 tracked people in one month, against ~2,900 records for journal-and-subject
# subscription — a ~29x reduction that also surfaced five podium-to-paper links
# the journal route could not. It covers preprints in the same call. Its blind
# spot is structural and permanent: people who publish refutations are not the
# people invited to keynote, so this route finds convergence and never finds
# the contradiction. Run both.

- id: a-openalex-authors
  name: OpenAlex author works
  type: author-tracking
  cadence: monthly
  topics: [oncology-clinical, immuno-oncology, ai-ml, foundation-models]
  access: open
  harvest:
    method: api
    endpoint: "https://api.openalex.org/works?filter=author.id:<id>,from_publication_date:<date>"
    notes: >-
      Resolve people via /authors?search= first. Do not trust the returned
      `authorships` institution blindly — wrong on 3 of 22 spot-checked records.
      Watchlist is data/speakers.yml.
  vault: null
  status: partial

- id: a-biorxiv
  name: bioRxiv / medRxiv
  type: author-tracking
  cadence: continuous
  topics: [genomics, single-cell-spatial, ai-ml]
  access: open
  harvest:
    method: api
    endpoint: "https://api.biorxiv.org/details/biorxiv/<from>/<to>"
    notes: >-
      Reached incidentally through the OpenAlex author route. Direct polling is
      only worth it for a named watchlist; unfiltered volume is unreadable.
  vault: null
  status: none

- id: a-europepmc
  name: Europe PMC
  type: author-tracking
  cadence: monthly
  topics: [oncology-clinical, genomics]
  access: open
  harvest:
    method: api
    endpoint: "https://www.ebi.ac.uk/europepmc/webservices/rest/search"
    notes: Fallback when an OpenAlex author id is ambiguous or missing.
  vault: null
  status: none
