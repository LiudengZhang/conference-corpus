# ---------------------------------------------------------------------------
# Journals added 2026-08-26 to close the gap between this registry and what the
# corpus actually reads. The index at data/index.sqlite is built from 33
# journals; fifteen of them were listed here and eighteen were not, which meant
# the registry described a smaller system than the one running.
#
# Harvest method is `pubmed-pt`, not RSS. RSS is a rolling window — it cannot
# reach a month that has already scrolled off, so it can maintain a corpus but
# never backfill one. PubMed E-utilities with an explicit publication-type
# filter is also the only cross-publisher-consistent way to isolate research
# articles: OpenAlex's `type:review` returns approximately zero for these
# journals, and reference-count heuristics collapse whole journals because
# publishers do not uniformly deposit reference lists.
#
# The shared query shape is:
#   esearch.fcgi?db=pubmed&term="<nlm-abbrev>"[ta]+AND+<YYYY/MM/DD>:<YYYY/MM/DD>[dp]
#                              +AND+"journal article"[pt]
#                              +NOT+(review[pt] OR editorial[pt] OR news[pt]
#                                    OR comment[pt] OR "case reports"[pt])
# then esummary.fcgi and bin on `sortpubdate`. Binning on anything else
# double-counts: [dp] matches every date attached to a record, so an
# ahead-of-print and its later issue date both hit, and about a fifth of raw
# rows land outside the month that returned them.

- id: j-nar
  name: Nucleic Acids Research
  pubmed: "Nucleic Acids Res"
  type: journal
  cadence: continuous
  topics: [bioinfo-tools, genomics]
  access: open
  harvest: {method: pubmed-pt, endpoint: "Nucleic Acids Res[ta]"}
  vault: null
  status: harvested
  notes: >-
    Highest-volume source in the corpus and mostly denominator: a large wet-lab
    molecular-biology block plus a ~200-paper database issue every January that
    by itself moves the corpus total 25-30%. Needs subject filtering before its
    counts mean anything.

- id: j-jama
  name: JAMA
  pubmed: "JAMA"
  type: journal
  cadence: weekly
  topics: [oncology-clinical]
  access: mixed
  harvest: {method: pubmed-pt, endpoint: "JAMA[ta]"}
  vault: null
