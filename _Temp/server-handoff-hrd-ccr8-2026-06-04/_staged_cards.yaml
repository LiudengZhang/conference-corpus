- id: pelka-2021-crc
  kind: dataset
  label: Pelka et al. — CRC MMRd/MMRp atlas WES + scRNA + MERFISH (n=62, Cell 2021)
  modality: multi-omics
  year: 2021
  status: published
  access: mixed
  papermap_category: atlas-singlecell
  url: https://doi.org/10.1016/j.cell.2021.08.003
  topics:
  - pan-cancer
  - tumor-microenvironment
  - single-cell
  - signatures
  why: 62 colorectal tumors (28 MMRd, 34 MMRp) with paired WES + scRNA-seq (~371k cells) and a MERFISH spatial subset; data at GEO GSE178341 and dbGaP phs002407. MMRd is the genomic-instability sibling of HRD, so this cohort serves as an analogue template for projecting the 4-scorer concordance logic onto a non-HR repair deficiency and as a pan-cancer TME comparator with an explicit hypermutated/IO-responsive arm.

